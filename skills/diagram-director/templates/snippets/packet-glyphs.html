<!-- =====================================================================
     packet-glyphs.html — semantic packet cargo from data/payloads.csv
     ---------------------------------------------------------------------
     WHY THIS FILE EXISTS
     User review 2026-08-26: every flow rendered the same dot, so a chat
     fanout, a file upload and a replication wire all looked identical.
     Cargo has meaning — a message, an envelope, a file, raw bits — and the
     diagram gets richer and more semantic when the packet SHOWS what it
     carries. One block per payloads.csv row (anchor `packet-<Payload ID>`).
     The plain dot stays the legal default: pick a themed glyph only when
     the row genuinely names this edge's cargo.

     THE CONTRACT (every glyph, no exceptions)
     1. GEOMETRY — each glyph's INK fits a 16 x 16 box CENTRED ON (0,0),
        i.e. all drawn coordinates live in -8..+8. Centred because the group
        rides an offset-path and offset-anchor defaults to the element's
        centre; an off-centre glyph would hang off the edge it travels. It
        must read at k=1 and magnify cleanly at beat zoom. The optional halo
        bleeds ~1.5px past that box by design — that overhang IS the
        knockout margin.
     2. ELEMENT BUDGET — <= 2 drawn elements, plus an OPTIONAL
        `.packet__halo` backing (the 16x16 surface plate below, or the tight
        r=5 ring for the dot). Same job as the house
        `.packet{stroke:var(--surface);stroke-width:3}` ring: it knocks the
        edge out from under the glyph so the glyph stays legible while
        crossing its own line. Drop the halo on quiet edges.
     3. NO TUMBLING — payload glyphs ride with `offset-rotate: 0deg`. An
        envelope that tumbles along a curve reads as garbage. ONLY the plain
        dot (packet-dot) may keep the house `offset-rotate: auto`, because a
        circle looks the same at every angle.
     4. COLOUR — currentColor for ink, `var(--surface)` for knockouts. Never
        a hex literal. The group inherits its ink from the `color` property,
        so a consumer points it at the edge's role token (see CSS below) and
        every skin gets payload glyphs for free.
     5. NEVER ICON-ONLY — the edge label still names the cargo. A glyph is a
        second channel, never the only one (same rule as node glyphs).
     6. REDUCED MOTION — same parking rule as house packets: the glyph parks
        at `offset-distance:100%; opacity:1` and every animation is off. A
        parked cargo glyph at the destination is a legible still; a hidden
        one loses the fact. The CSS lives in the consuming template.

     CONSUMER CSS (paste into the template's stylesheet; the snippets below
     carry geometry only, per the house split)

       .packet--cargo{
         color:var(--line);              /* or var(--role-data) etc. */
         offset-distance:0%;
         offset-rotate:0deg;             /* rule 3 — dot may use auto */
       }
       .packet__halo {fill:var(--surface);stroke:var(--surface);
                      stroke-width:3;stroke-linejoin:round}
       @media (prefers-reduced-motion: reduce){
         .packet--cargo{animation:none!important;
                        offset-distance:100%!important;opacity:1!important}
       }

     Each block's offset-path `d` is copied VERBATIM from its edge, exactly
     like the house packets — a drifted path sends the cargo down a route
     that does not exist.
     ===================================================================== -->

<!-- snippet: packet-dot -->
<!-- request: THE ARCHETYPE and the legal default. A circle reads the same at
     every angle, so this is the one glyph that may keep offset-rotate:auto.
     Halo is the tight house ring, not the 16x16 plate. -->
<g class="packet packet--cargo packet--request" aria-hidden="true">
  <circle class="packet__halo" r="5" />
  <circle class="packet__glyph" r="5" fill="currentColor" />
</g>

<!-- snippet: packet-chat-bubble -->
<!-- message: bubble body + tail authored as ONE path so the tail cannot
     drift off the body when the glyph is scaled. -->
<g class="packet packet--cargo packet--message" aria-hidden="true">
  <rect class="packet__halo" x="-8" y="-8" width="16" height="16" rx="5" />
  <path class="packet__glyph" fill="currentColor"
        d="M -4 -7 H 4 A 3 3 0 0 1 7 -4 V 1 A 3 3 0 0 1 4 4 H 0 L -4 8 V 4 A 3 3 0 0 1 -7 1 V -4 A 3 3 0 0 1 -4 -7 Z" />
</g>

<!-- snippet: packet-envelope -->
<!-- email: filled body + a surface-coloured flap knocked out of it. The flap
     is a knockout (not a second ink stroke) so the envelope still reads as
     one solid mass at k=1 instead of a thicket of thin lines. -->
<g class="packet packet--cargo packet--email" aria-hidden="true">
  <rect class="packet__halo" x="-8" y="-8" width="16" height="16" rx="5" />
  <rect class="packet__glyph" x="-7.1" y="-5" width="14.2" height="10" rx="1.5" fill="currentColor" />
  <path class="packet__glyph" fill="none" stroke="var(--surface)" stroke-width="1.6"
        stroke-linejoin="round" d="M -7.1 -5 L 0 1.5 L 7.1 -5" />
</g>

<!-- snippet: packet-file -->
<!-- file: document sheet with the folded corner cut out. The fold is the
     only thing separating this from a plain rect, so it is geometry (a
     notch in the outline) plus one knockout line, never a colour hint. -->
<g class="packet packet--cargo packet--file" aria-hidden="true">
  <rect class="packet__halo" x="-8" y="-8" width="16" height="16" rx="5" />
  <path class="packet__glyph" fill="currentColor"
        d="M -5.5 -7.3 H 1.5 L 6 -2.8 V 7.3 H -5.5 Z" />
  <path class="packet__glyph" fill="none" stroke="var(--surface)" stroke-width="1.4"
        stroke-linejoin="round" d="M 1.5 -7.3 V -2.8 H 6" />
</g>

<!-- snippet: packet-bits -->
<!-- binary-stream: a chip bearing real mono text "101". Text, not a path,
     so it stays crisp at beat zoom — but it is aria-hidden DECORATION: the
     edge label carries the meaning (rule 5). Sizing is MEASURED, not
     guessed (headless Chrome, 2026-08-26): "101" at font-size 7 renders
     12.66px wide — the ~0.6em-per-char rule holds — against 14.0px of
     clear width inside the chip (15 wide minus the 1.0 stroke), so 1.34px
     of slack. Enlarging the text without widening the chip clips the "1"s;
     that exact mistake shipped once on the token-strip chips. The chip is
     15 not 16 wide so ink + stroke lands exactly on the ±8 box. -->
<g class="packet packet--cargo packet--binary-stream" aria-hidden="true">
  <rect class="packet__halo" x="-8" y="-8" width="16" height="16" rx="5" />
  <rect class="packet__glyph" x="-7.5" y="-5.5" width="15" height="11" rx="2"
        fill="none" stroke="currentColor" stroke-width="1" />
  <text class="packet__glyph packet__bits" x="0" y="0" fill="currentColor"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="7" text-anchor="middle" dominant-baseline="central"
        style="font-variant-ligatures:none">101</text>
</g>

<!-- snippet: packet-key -->
<!-- token: bow + toothed shaft. Stroke-drawn (not filled) so a credential
     reads as light and small next to the solid data glyphs. -->
<g class="packet packet--cargo packet--token" aria-hidden="true">
  <rect class="packet__halo" x="-8" y="-8" width="16" height="16" rx="5" />
  <circle class="packet__glyph" cx="-3.4" cy="0" r="3.4"
          fill="none" stroke="currentColor" stroke-width="2" />
  <path class="packet__glyph" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" d="M 0 0 H 6.9 M 4 0 V 3.2 M 6.5 0 V 3.2" />
</g>

<!-- snippet: packet-magnifier -->
<!-- query: lens + handle. Shares the magnifier idiom with the search-service
     node glyph on purpose — same concept, one carried by a node, one by a
     packet. -->
<g class="packet packet--cargo packet--query" aria-hidden="true">
  <rect class="packet__halo" x="-8" y="-8" width="16" height="16" rx="5" />
  <circle class="packet__glyph" cx="-1.5" cy="-1.5" r="4.8"
          fill="none" stroke="currentColor" stroke-width="2" />
  <path class="packet__glyph" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" d="M 2 2 L 6.2 6.2" />
</g>

<!-- snippet: packet-ping -->
<!-- event: dot + ONE concentric ring — the emitted-and-gone shape. One ring
     only: a second ring reads as a repeating radar sweep, which claims
     periodicity the row does not mean. -->
<g class="packet packet--cargo packet--event" aria-hidden="true">
  <circle class="packet__halo" r="6.8" />
  <circle class="packet__glyph" r="6.8" opacity="0.55"
          fill="none" stroke="currentColor" stroke-width="1.6" />
  <circle class="packet__glyph" r="3.2" fill="currentColor" />
</g>

<!-- snippet: packet-coin -->
<!-- transaction: a BANKNOTE (rounded note + knocked-out seal dot), not a coin.
     The first cut was a filled disc with a knocked-out bar and the render
     review (2026-08-26) read it as a minus / no-entry sign — on a flow line
     that is ACTIVELY wrong, it claims the edge is blocked. A note with a
     centre seal cannot take that reading, still names no currency
     ($ / € / ₫ would pin the diagram to one locale), and stays distinct
     from the payment-provider NODE glyph (that card carries a top stripe;
     this note carries a centre dot). -->
<g class="packet packet--cargo packet--transaction" aria-hidden="true">
  <rect class="packet__halo" x="-7.5" y="-4.5" width="15" height="9" rx="1.5" />
  <rect class="packet__glyph" x="-7.5" y="-4.5" width="15" height="9" rx="1.5" fill="currentColor" />
  <circle class="packet__glyph" r="2" fill="var(--surface)" />
</g>

<!-- snippet: packet-play -->
<!-- media: disc + knocked-out play triangle. Optically centred: a triangle
     centred on its bbox looks left-heavy inside a circle, so the apex sits
     at x=3.6 against a -2.4 back edge. -->
<g class="packet packet--cargo packet--media" aria-hidden="true">
  <circle class="packet__halo" r="6.8" />
  <circle class="packet__glyph" r="6.8" fill="currentColor" />
  <path class="packet__glyph" fill="var(--surface)" stroke="none"
        d="M -2.4 -3.6 L 3.6 0 L -2.4 3.6 Z" />
</g>

<!-- snippet: packet-feedback -->
<!-- feedback: a MARKER PEN — body plus the shoulder knocked out to make the
     nib read. Feedback is an annotation ABOUT the work, so the glyph is the
     thing that writes on it.
     Two shapes were rejected first and the reasons matter. A circular arrow
     was the obvious "loop closes" reading and is wrong on a system-design
     edge, where a circular arrow means RETRY. A star reads as a rating, and
     a rating is a score, not an ask. What a feedback packet must say is
     "somebody wrote something about this that changes the next pass".
     Distinct from packet-chat-bubble (conversation), packet-file (a whole
     document) and packet-ping (fire-and-forget) at k=1. -->
<g class="packet packet--cargo packet--feedback" aria-hidden="true">
  <rect class="packet__halo" x="-8" y="-8" width="16" height="16" rx="5" />
  <path class="packet__glyph" fill="currentColor"
        d="M 3.64 -6.76 L 6.76 -3.64 L -1.44 4.56 L -6.8 6.8 L -4.56 1.44 Z" />
  <path class="packet__glyph" fill="none" stroke="var(--surface)" stroke-width="1.3"
        d="M -4.56 1.44 L -1.44 4.56" />
</g>
