<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0 → 500K CCU — five architectures, five break points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff;
  --grid:color-mix(in srgb, #0f172a 5%, transparent);
  --ink:#0f172a; --muted:#64748b; --stroke:#475569; --stroke-w:1.8px;
  --font-title:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-label:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* roles: data/color-semantics.csv, Style ID flat-minimal, palette house */
  --role-client:#dbeafe;  --ink-client:#2563eb;  --accent-client:#3b82f6;
  --role-service:#ffedd5; --ink-service:#ea580c; --accent-service:#f97316;
  --role-data:#dcfce7;    --ink-data:#16a34a;    --accent-data:#22c55e;
  --role-async:#f3e8ff;   --ink-async:#9333ea;   --accent-async:#a855f7;
  --role-infra:#f1f5f9;   --ink-infra:#475569;   --accent-infra:#14b8a6;
  --role-error:#fee2e2;   --ink-error:#dc2626;   --accent-error:#ef4444;
  /* educational-register state tints (state-effects.css -> state-overlay-replica).
     Custom rows, checked by hand: --ink-warn is 4.80:1 on the canvas and 4.51:1 on
     its own fill; --muted reads 4.27:1 on the amber replica and 4.35:1 on the
     degrade replica — at parity with the house role fills. */
  --role-warn:#fef3c7;    --ink-warn:#b45309;
  --role-degrade:#fef2f2;
  /* every ambient loop divides the 48s master: 2400x20, 1600x30, 1200x40, 120x400 */
  --dur-flow:2400ms; --dur-dash:1200ms; --dur-fill:2400ms; --dur-pulse:1600ms;
  --ease-flow:ease-in-out; --master:48s;
}
html,body{margin:0;background:var(--bg)}
body{display:grid;place-items:center;min-height:100vh}
svg{display:block;width:min(100vw,177.8vh);height:auto}
.world-grid{fill:url(#grid-pat)}
/* ---- scenery chrome: title + legend, out while the camera is inside an act ---- */
.layer-chrome{animation-duration:var(--master);animation-timing-function:linear;
              animation-iteration-count:infinite}
.title{font:700 34px var(--font-title);fill:var(--ink);text-anchor:middle}
.subtitle{font:400 16px var(--font-label);fill:var(--muted);text-anchor:middle}
/* act title card: scenery, so the display treatment is allowed here (a caption is
   the narrator at the smallest size on screen; this is a chapter heading). It
   names the ARCHITECTURE MODEL of the act, not only the load band. Fixed slot,
   top-left, identical in every act — zoning rule 3 applies to chrome too. */
.act-title{font:700 40px var(--font-title);fill:var(--ink);letter-spacing:.01em}
.act-title__sub{font:600 16px var(--font-mono);fill:var(--muted);letter-spacing:.08em}
.verdict-box{fill:var(--ink);opacity:.95}
.verdict{font:600 13px var(--font-mono);fill:var(--surface);text-anchor:middle;font-variant-ligatures:none}
/* ---- nodes: flat-minimal skin (light canvas, zero shadow) ---- */
.node__shape{fill:var(--surface);stroke:var(--stroke);stroke-width:var(--stroke-w);stroke-opacity:.9}
.node[data-role="client"] .node__shape{fill:var(--role-client);stroke:var(--ink-client)}
.node[data-role="service"] .node__shape{fill:var(--role-service);stroke:var(--ink-service)}
.node[data-role="data"] .node__shape{fill:var(--role-data);stroke:var(--ink-data)}
.node[data-role="async"] .node__shape{fill:var(--role-async);stroke:var(--ink-async)}
.node[data-role="infra"] .node__shape{fill:var(--role-infra);stroke:var(--ink-infra)}
/* ============ THE ACT-WEIGHT LADDER (trialled principle 1) =================
   flat-minimal ships exactly ONE stroke step: `.node--primary` = calc(--stroke-w
   * 1.4). This cut walks that same x1.4 step in BOTH directions instead of
   inventing a second visual language.
     new      3.2px   — carried verbatim from the frozen golden's .node--new
     base     1.8px   — --stroke-w
     veteran  1.286px — calc(--stroke-w / 1.4), one step DOWN the same ladder
   The opacity step is flat-minimal's own `.node__detail` tier (.65) — one step
   back from ink, and well clear of the `.is-idle` floor (.35), because a veteran
   is still running, not idle. Opacity rides `.node__body` only, exactly as
   `.is-idle` does, so the veteran's LABEL keeps full ink and stays AA-legible. */
.node--new .node__shape{stroke-width:3.2px;stroke-opacity:1}
.node--veteran .node__shape{stroke-width:calc(var(--stroke-w) / 1.4)}
.node--veteran .node__body{opacity:.65}
/* retired-component ghost: the ONE farewell window a removed component gets, on the
   first act after its removal. Outline only -- a filled ghost reads as a component
   still running, and acts/retired-ghost-missing refuses one. It is NOT class="node"
   and carries NO data-node-id: it is the memory of a component, not the component,
   and giving it the id would put app-monolith back into act 2's id set. */
.is-ghost{opacity:.38}
.is-ghost .node__shape{fill:none;stroke:var(--muted);stroke-width:1.286px;
  stroke-dasharray:7 6}
.node-ghost__label{font:500 14px var(--font-label);fill:var(--muted);text-anchor:middle;
  letter-spacing:.02em}
.node-ghost__note{font:400 12px var(--font-mono);fill:var(--muted);text-anchor:middle;
  font-variant-ligatures:none}
.node__ghost--1{--ghost:.3}
.node__ghost--2{--ghost:.5}
.node--veteran .node__ghost--1{--ghost:.2}   /* .3 x .65 */
.node--veteran .node__ghost--2{--ghost:.33}  /* .5 x .65 */
/* compress (trialled principle 2): a solved lesson keeps its slot but drops to
   flat-minimal's OWN base type sizes (--fs-label 16 / --fs-sub 13) at the
   supporting 0.85 box SKILL.md already defines, on top of the veteran ladder.
   No new value is introduced — detail follows the CURRENT act's lesson. */
.node--compress .node__label{font-size:16px}
.node--compress .node__sub{font-size:13px}
.node__label{font:600 18px var(--font-label);fill:var(--ink);text-anchor:middle}
.node__sub{font:400 15px var(--font-label);fill:var(--muted);text-anchor:middle}
.node--support .node__label{font-size:16px}
.node__sub,.edge__label--mono,.verdict,.state-chip{font-variant-ligatures:none}
/* ---- node detail art (device chrome bar, pipe lanes, glyph badges) ---- */
.node__detail{fill:none;stroke-width:1;opacity:.65;stroke-linecap:round}
.node[data-role="client"] .node__detail{stroke:var(--ink-client)}
.node[data-role="service"] .node__detail{stroke:var(--ink-service)}
.node[data-role="data"] .node__detail{stroke:var(--ink-data)}
.node[data-role="async"] .node__detail{stroke:var(--ink-async)}
.node[data-role="infra"] .node__detail{stroke:var(--ink-infra)}
.node__detail--dashed{stroke-dasharray:5 4}
.node__icon{stroke:none;opacity:.9}
.node[data-role="client"] .node__icon{fill:var(--ink-client)}
.node[data-role="data"] .node__icon{fill:var(--ink-data)}
.queue__track{fill:var(--ink);opacity:.16;stroke:none}
.queue__fill{fill:var(--accent-async);stroke:none}
.queue .node__detail{stroke:var(--role-async);opacity:.9}
/* ---- edges: house weights, quiet by default, async dashed ---- */
.edge{fill:none;stroke:var(--stroke);stroke-width:2px;stroke-opacity:.55;
      stroke-linecap:round;stroke-linejoin:round;marker-end:url(#v-arrow)}
.edge--async{stroke:var(--ink-async);stroke-opacity:.8;stroke-dasharray:12 9;marker-end:url(#v-arrow-open)}
.edge--idle{stroke-opacity:.3}
.anim-dash-flow{animation:dash-flow var(--dur-dash) linear infinite}
@keyframes dash-flow{to{stroke-dashoffset:-42}}
.edge__label{font:500 13px var(--font-label);fill:var(--muted)}
/* the load-ratio labels: mono, inked, so `read x10` vs `write x1` reads as DATA
   on the edge rather than as prose. Numbers come from the sheet's NUMBERS block. */
.edge__label--mono{font:500 12.5px var(--font-mono);fill:var(--ink)}
.marker{fill:var(--stroke);stroke:none}
.marker--open{fill:none;stroke:var(--ink-async);stroke-width:1.6;stroke-linecap:round}
/* ---- states (data/states.csv) drawn as OVERLAYS, never node mutations ---- */
.state-chip-box{fill:var(--ink-error)}
.state-chip-box--sync{fill:var(--ink-async)}
.state-chip{font:600 11px var(--font-label);fill:#ffffff;text-anchor:middle;letter-spacing:.04em}
.load-track{fill:var(--muted);opacity:.15}
.load-bar{fill:var(--accent-error);opacity:.55}
.anim-queue-fill{clip-path:inset(0 100% 0 0);animation:queue-fill var(--dur-fill) ease-out infinite alternate}
@keyframes queue-fill{from{clip-path:inset(0 40% 0 0)}to{clip-path:inset(0 var(--empty,3%) 0 0)}}
.state-degrade-ring{fill:none;stroke:var(--ink-error);stroke-width:2.6;stroke-dasharray:6 3;
  animation:ring-pulse var(--dur-pulse) ease-in-out infinite alternate}
@keyframes ring-pulse{from{opacity:.6}to{opacity:1}}
.state-sync-line{fill:none;stroke:var(--ink-async);stroke-width:2;stroke-dasharray:10 4;
  animation:sync-drift var(--dur-dash) linear infinite}
@keyframes sync-drift{to{stroke-dashoffset:-28}}
/* is-selected (states.csv): role-accent stroke at +1px weight on the chosen
   node — two channels, never colour alone — paired with the routing label
   `hash 7c` on the edge. Its Motion Ref is pulse-glow, but pulse-glow carries a
   drop-shadow FILTER and SKILL.md forbids a filter on an element that animates
   under a moving camera, so the intensity rides the same opacity-only
   `ring-pulse` every other state overlay in this cut uses. */
.state-select-ring{fill:none;stroke:var(--accent-data);stroke-width:5px;
  animation:ring-pulse var(--dur-pulse) ease-in-out infinite alternate}
/* the COLORED REPLICA (state-effects.css -> state-overlay-replica): a full copy of
   the node's shape in the STATE's tokens, inside the state's overlay group. The
   window's opacity recolours the node without the base paint ever being animated. */
.state-replica{stroke-width:3.4px}
.state-replica--warn{fill:var(--role-warn);stroke:var(--ink-warn)}
.state-replica--error{fill:var(--role-degrade);stroke:var(--ink-error);stroke-dasharray:6 3}
.state-replica__detail{fill:none;stroke-width:1;opacity:.65;stroke-linecap:round}
.state-replica__detail--warn{stroke:var(--ink-warn)}
.state-replica__detail--error{stroke:var(--ink-error)}
/* shake-stress: 120ms divides the 48s master 400 times, so the loop seam is closed
   without a delay. Amplitude capped at 1.5px so the label underneath stays readable. */
.anim-shake-stress{animation:shake-stress 120ms linear infinite}
@keyframes shake-stress{0%,100%{transform:translate(-1.5px,0)}25%{transform:translate(1.2px,-.6px)}
  50%{transform:translate(-1.1px,.6px)}75%{transform:translate(1.5px,0)}}
/* ---- packets: payload glyphs (packet-glyphs.html consumer CSS) ---- */
.packet--cargo{color:var(--stroke);offset-distance:0%;offset-rotate:0deg}
.packet--request{offset-rotate:auto}
.packet--event{color:var(--ink-async)}
.packet--binary-stream{color:var(--ink-async)}
.packet__halo{fill:var(--surface);stroke:var(--surface);stroke-width:3;stroke-linejoin:round}
.anim-packet{animation:pkt var(--dur-flow) var(--ease-flow) infinite}
@keyframes pkt{0%{offset-distance:0%;opacity:0}8%{opacity:1}42%{offset-distance:100%;opacity:1}
               50%,100%{offset-distance:100%;opacity:0}}
.legend text{font:400 13px var(--font-label);fill:var(--ink)}
.legend .k{font-weight:600}
/* ---- camera: one hold per act (constant k inside the tier band, so growth is
       read as boxes APPEARING in fixed slots), plus one read-gate zoom on the
       T5 write path, plus the overview for the intro and the five recaps ---- */
.camera{transform-origin:0 0;animation:beats var(--master) linear infinite}
@keyframes beats{

  5%,13.75%{transform:translate(-364px,-115px) scale(1.4388);animation-timing-function:ease-in-out}
  15%,23.75%{transform:translate(-364px,-115px) scale(1.4388);animation-timing-function:ease-in-out}
  25%,55.4167%{transform:translate(-430px,-72px) scale(1.3431);animation-timing-function:ease-in-out}
  56.6667%,65.8333%{transform:translate(-984px,-412px) scale(1.8083);animation-timing-function:ease-in-out}
  67.0833%,73.75%{transform:translate(-430px,-72px) scale(1.3431);animation-timing-function:ease-in-out}
  75%,100%{transform:none}
}

<svg viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Scaling one system from 0 to 500K concurrent users across five architectures</title>
  <desc id="d">One system, five architectures; what broke decided every boundary, and the traffic
  mix is ten reads per write throughout — about one operation per user every fifteen seconds, so
  one write for every eleven operations. Act 1, MONOLITH, to 1K concurrent users: browsers reach one
  four-vCPU monolith which opens a read path at ten units and a write path at one unit into a single
  Postgres primary; sixty-seven operations a second at one and a half seconds each keep a hundred
  requests in flight, the pool is full, and Postgres turns amber and trembles behind a 100 of 100
  connections chip. Act 2, HORIZONTAL SCALE-OUT, to 10K: an application load balancer, six app
  replicas and a Redis cache with a ninety percent hit rate clear the pool — reads at ten units hit
  Redis and only the one-unit miss reaches Postgres — but sixty-one cache misses and sixty-one writes
  a second now share one box, so half of the primary's work is reads and it goes amber again behind a
  READS 50% chip. Act 3, READ / WRITE SPLIT, to 100K: a CDN fronts static and API traffic, three read
  replicas take the cache misses behind a 1.8 second lag chip, and a queue holds emails and exports
  which four workers drain one job per worker. Nothing on this tier is saturated — the boundary out
  of it is the only one in the story that is not a load number: one deployable still owns auth,
  catalog and orders, so one release and one crash cover all three. Act 4, MICROSERVICES, to 300K:
  one API gateway routes by path to three domain services — auth, catalog and orders — auth owning
  its own private database; because the services can no longer call each other, the order service
  publishes one order.created event to a pub/sub stream that fans out to two subscribers, the catalog
  service which invalidates its cached stock and the workers which send the receipt. But the split
  moved the code, not the write path: every order write still lands on ONE Postgres primary, and at
  300K that is one thousand eight hundred writes a second against its roughly two thousand a second
  ceiling, so the primary ends the act carrying both a HOT ROW and a 2K WPS chip. Act 5, SHARD THE
  WRITES, to 500K: a shard router takes the primary's old slot and picks the owning shard from the
  hash of the shard key; this write hashes to 7c, which falls in range 56 to aa, so it travels to shard
  2 of 3 alone and the other two shards stay idle for it. Three thousand writes a second spread over
  three primaries is about one thousand each, roughly half of each shard's ceiling. The solved auth
  and catalog lesson is drawn small and faded here, and the three read replicas remain, still serving
  catalog reads. The five acts then replay in order and the loop parks on act 5. These five are the
  BASIC patterns — the standard baseline of scaling, taught here in their simplest form; real systems
  diverge, and this ladder is not the answer to every problem.</desc>
