    <title id="dgm-title">AI agents: without Jev vs with Jev</title>
    <desc id="dgm-desc">A comparison in two acts of one ticket dispatcher: a ticket arrives and the system has to decide which agent takes it -- the support agent, the sales agent or the complaint agent. Act 1, without Jev: the ticket API receives tickets from every channel, the state builder merges the ticket with account facts from the customer db into one versioned state, and an LLM router is asked which agent should take it. The code needs one word such as sales, yet the LLM still generates it token by token; in an agent that runs many steps every small choice is another wait, and on an assumed 50K tickets a day the peak hour leaves the LLM router overloaded, carrying about 34 calls at once. The dispatcher gets only a label with no trustworthy probability, so a wrong hand-off goes unnoticed. Severe complaints go from the complaint agent to the human desk. Act 2, with Jev: the Jev gateway sends the state and three questions from the decision registry -- which agent, how urgent, is it a complaint -- in one call; they are scored in parallel in roughly 70 to 500 ms and come back with probabilities. The dispatcher, deterministic code, compares each probability with its threshold and assigns a confident ticket straight to that agent with a compare-and-set on state_version; a stale state goes back to the state builder. An unsure ticket, the other option, or a Jev timeout goes to a triage LLM that picks the agent. Severe complaints and risky actions such as refunds always wait at the human desk, which also reviews a random sample of confident dispatches. Every dispatch lands in the outcome log with its probability and what really happened -- resolved, handed back, escalated -- and the calibration monitor compares the two and tunes the thresholds in the registry. Closing point: the agents do the work, Jev picks the agent, and the dispatch rules stay in code.</desc>
