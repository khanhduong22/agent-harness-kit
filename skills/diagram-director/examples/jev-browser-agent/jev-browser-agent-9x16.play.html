    <title id="dgm-title">Browser agent: LLM vs Jev — 9:16</title>
    <desc id="dgm-desc">A browser agent doing one task, in two acts: find one-way flights from Zurich to London on a Google Flights page whose three controls are indexed [1] button Change ticket type, [2] combobox Where from?, and [3] combobox Where to?. Act 1, the action is WRITTEN by a text LLM: every step, code reads the page's DOM tree into an indexed list of elements, with a screenshot when vision is on; the whole page state becomes the model's prompt and it generates, token by token, one JSON object with thinking, next_goal and an action list -- an estimated two to five seconds per step. The executor parses that JSON, checks the index it names against the live page, runs the click or the input, and the loop repeats for N steps -- every step waiting for a model to write text, and every action arriving as text that code has to parse and re-check, because nothing structural stops the model naming an element the page does not offer. Act 2, the action is CHOSEN by Jev: one browser call reads every visible control atomically with its name, value and text, and no screenshot. Jev answers two questions in one round trip of roughly 70 to 500 milliseconds -- which operation, and which target -- over the operations and elements the page itself offered, with a probability per option and no free text. Only when the operation is TYPE_TEXT does a small LLM write the text to type, and its output must parse as a small JSON object first. Before acting, the validator rechecks that the page is still fresh, that the target is still visible and not occluded; a stale page re-observes instead of acting, and a retry never double-clicks. Then it types Zurich into the Where from? combobox, waits at most 200 ms for the suggestions, and reads the page again -- 7.1 seconds for the whole task. Closing point: an LLM writes an answer that code must parse; Jev only picks from the menu the page itself put up, with a probability attached.</desc>
