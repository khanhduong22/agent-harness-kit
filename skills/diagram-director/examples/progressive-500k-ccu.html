<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0 → 500K CCU — four architectures, four break points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff;
  --grid:color-mix(in srgb, #0f172a 5%, transparent);
  --ink:#0f172a; --muted:#64748b; --stroke:#475569; --stroke-w:1.8px;
  --font-title:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-label:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --role-client:#dbeafe;  --ink-client:#2563eb;  --accent-client:#3b82f6;
  --role-service:#ffedd5; --ink-service:#ea580c; --accent-service:#f97316;
  --role-data:#dcfce7;    --ink-data:#16a34a;    --accent-data:#22c55e;
  --role-async:#f3e8ff;   --ink-async:#9333ea;   --accent-async:#a855f7;
  --role-infra:#f1f5f9;   --ink-infra:#475569;   --accent-infra:#14b8a6;
  --role-error:#fee2e2;   --ink-error:#dc2626;   --accent-error:#ef4444;
  /* educational-register state tints — the colored replica's palette
     (state-effects.css → state-overlay-replica). Custom rows, so checked by
     hand rather than by the CSV validator: --ink-warn is 4.80:1 on the canvas
     and 4.51:1 on its own fill; --muted reads 4.27:1 on the amber replica and
     4.35:1 on the degrade replica, both at parity with the house role fills
     (--muted on --role-data is 4.33:1). */
  --role-warn:#fef3c7;    --ink-warn:#b45309;
  --role-degrade:#fef2f2;
  /* every ambient loop divides the 38.4s master: 2400x16, 1600x24, 1200x32 */
  --dur-flow:2400ms; --dur-dash:1200ms; --dur-fill:2400ms; --dur-pulse:1600ms;
  --ease-flow:ease-in-out; --master:38.4s;
}
html,body{margin:0;background:var(--bg)}
body{display:grid;place-items:center;min-height:100vh}
svg{display:block;width:min(100vw,177.8vh);height:auto}
.world-grid{fill:url(#grid-pat)}
/* ---- scenery chrome: title + legend, out while the camera is inside an act ---- */
.layer-chrome{animation:chrome-fade var(--master) linear infinite}
@keyframes chrome-fade{0%,2.8%{opacity:1}4.4%,67.1875%{opacity:0}68.75%,100%{opacity:1}}
.title{font:700 34px var(--font-title);fill:var(--ink);text-anchor:middle}
.subtitle{font:400 16px var(--font-label);fill:var(--muted);text-anchor:middle}
/* act title card: scenery, so display treatment is allowed here (a caption is
   the narrator at the smallest size on screen; this is a chapter heading).
   Staged with its act, parked in the layout's title band. */
.act-title{font:700 40px var(--font-title);fill:var(--ink);letter-spacing:.01em}
.act-title__sub{font:600 16px var(--font-mono);fill:var(--muted);letter-spacing:.08em}
.verdict-box{fill:var(--ink);opacity:.95}
.verdict{font:600 13px var(--font-mono);fill:var(--surface);text-anchor:middle;font-variant-ligatures:none}
/* ---- nodes: flat-minimal skin (light canvas, zero shadow) ---- */
.node__shape{fill:var(--surface);stroke:var(--stroke);stroke-width:var(--stroke-w);stroke-opacity:.9}
.node[data-role="client"] .node__shape{fill:var(--role-client);stroke:var(--ink-client)}
.node[data-role="service"] .node__shape{fill:var(--role-service);stroke:var(--ink-service)}
.node[data-role="data"] .node__shape{fill:var(--role-data);stroke:var(--ink-data)}
.node[data-role="async"] .node__shape{fill:var(--role-async);stroke:var(--ink-async)}
.node[data-role="infra"] .node__shape{fill:var(--role-infra);stroke:var(--ink-infra)}
/* new in this act = a WEIGHT step, never colour alone (legend states it) */
.node--new .node__shape{stroke-width:3.2px;stroke-opacity:1}
.node__label{font:600 18px var(--font-label);fill:var(--ink);text-anchor:middle}
.node__sub{font:400 15px var(--font-label);fill:var(--muted);text-anchor:middle}
.node--support .node__label{font-size:16px}
.node__sub,.edge__label--mono,.verdict,.state-chip{font-variant-ligatures:none}
/* ---- node detail art (device chrome bar, pipe lanes, glyph badges) ---- */
.node__detail{fill:none;stroke-width:1;opacity:.65;stroke-linecap:round}
.node[data-role="client"] .node__detail{stroke:var(--ink-client)}
.node[data-role="service"] .node__detail{stroke:var(--ink-service)}
.node[data-role="data"] .node__detail{stroke:var(--ink-data)}
.node[data-role="async"] .node__detail{stroke:var(--ink-async)}
.node[data-role="infra"] .node__detail{stroke:var(--ink-infra)}
.node__detail--dashed{stroke-dasharray:5 4}
.node__icon{stroke:none;opacity:.9}
.node[data-role="client"] .node__icon{fill:var(--ink-client)}
.node[data-role="data"] .node__icon{fill:var(--ink-data)}
.queue__track{fill:var(--ink);opacity:.16;stroke:none}
.queue__fill{fill:var(--accent-async);stroke:none}
.queue .node__detail{stroke:var(--role-async);opacity:.9}
/* ---- edges: house weights, quiet by default, async dashed ---- */
.edge{fill:none;stroke:var(--stroke);stroke-width:2px;stroke-opacity:.55;
      stroke-linecap:round;stroke-linejoin:round;marker-end:url(#v-arrow)}
.edge--async{stroke:var(--ink-async);stroke-opacity:.8;stroke-dasharray:12 9;marker-end:url(#v-arrow-open)}
.anim-dash-flow{animation:dash-flow var(--dur-dash) linear infinite}
@keyframes dash-flow{to{stroke-dashoffset:-42}}
.edge__label{font:500 13px var(--font-label);fill:var(--muted)}
.edge__label--mono{font:500 12.5px var(--font-mono);fill:var(--ink)}
.marker{fill:var(--stroke);stroke:none}
.marker--open{fill:none;stroke:var(--ink-async);stroke-width:1.6;stroke-linecap:round}
/* ---- states (data/states.csv) drawn as OVERLAYS, never node mutations ---- */
.state-chip-box{fill:var(--ink-error)}
.state-chip-box--sync{fill:var(--ink-async)}
.state-chip{font:600 11px var(--font-label);fill:#ffffff;text-anchor:middle;letter-spacing:.04em}
.load-track{fill:var(--muted);opacity:.15}
.load-bar{fill:var(--accent-error);opacity:.55}
.anim-queue-fill{clip-path:inset(0 100% 0 0);animation:queue-fill var(--dur-fill) ease-out infinite alternate}
@keyframes queue-fill{from{clip-path:inset(0 40% 0 0)}to{clip-path:inset(0 var(--empty,3%) 0 0)}}
.state-degrade-ring{fill:none;stroke:var(--ink-error);stroke-width:2.6;stroke-dasharray:6 3;
  animation:ring-pulse var(--dur-pulse) ease-in-out infinite alternate}
@keyframes ring-pulse{from{opacity:.55}to{opacity:1}}
.state-sync-line{fill:none;stroke:var(--ink-async);stroke-width:2;stroke-dasharray:10 4;
  animation:sync-drift var(--dur-dash) linear infinite}
@keyframes sync-drift{to{stroke-dashoffset:-28}}
/* the COLORED REPLICA (state-effects.css → state-overlay-replica): a full copy
   of the node's shape in the STATE's tokens, living inside the state's overlay
   group. The window's opacity recolours the whole node without the base paint
   ever being animated. Stroke runs heavier than the base 1.8px so the replica
   still covers it while shake-stress is displacing it. */
.state-replica{stroke-width:3.4px}
.state-replica--warn{fill:var(--role-warn);stroke:var(--ink-warn)}
.state-replica--error{fill:var(--role-degrade);stroke:var(--ink-error);stroke-dasharray:6 3}
/* the replica is opaque, so the shape's own detail art (a cylinder's cap arc)
   has to be re-drawn on top of it in the state's stroke — otherwise the
   archetype disappears the moment the state arrives */
.state-replica__detail{fill:none;stroke-width:1;opacity:.65;stroke-linecap:round}
.state-replica__detail--warn{stroke:var(--ink-warn)}
.state-replica__detail--error{stroke:var(--ink-error)}
/* shake-stress: 120ms divides the 38.4s master 320 times, so the loop seam is
   closed without a delay. Amplitude capped at 1.5px — the node's own label
   stays put underneath and stays readable. */
.anim-shake-stress{animation:shake-stress 120ms linear infinite}
@keyframes shake-stress{0%,100%{transform:translate(-1.5px,0)}25%{transform:translate(1.2px,-.6px)}
  50%{transform:translate(-1.1px,.6px)}75%{transform:translate(1.5px,0)}}
/* ---- packets: payload glyphs (packet-glyphs.html consumer CSS) ---- */
.packet--cargo{color:var(--stroke);offset-distance:0%;offset-rotate:0deg}
.packet--request{offset-rotate:auto}
.packet--event{color:var(--ink-async)}
.packet--binary-stream{color:var(--ink-async)}
.packet__halo{fill:var(--surface);stroke:var(--surface);stroke-width:3;stroke-linejoin:round}
.anim-packet{animation:pkt var(--dur-flow) var(--ease-flow) infinite}
@keyframes pkt{0%{offset-distance:0%;opacity:0}8%{opacity:1}42%{offset-distance:100%;opacity:1}
               50%,100%{offset-distance:100%;opacity:0}}
.legend text{font:400 13px var(--font-label);fill:var(--ink)}
.legend .k{font-weight:600}
/* ---- camera: gentle per-act framing, overview for recap + parking ---- */
.camera{transform-origin:0 0;animation:beats var(--master) linear infinite}
@keyframes beats{
  0%,2.8%{transform:none;animation-timing-function:ease-in-out}
  5.2083%,17.1875%{transform:translate(-720px,-252px) scale(1.6);animation-timing-function:ease-in-out}
  18.75%,34.375%{transform:translate(-608px,-252px) scale(1.6);animation-timing-function:ease-in-out}
  35.9375%,65%{transform:translate(-512px,-252px) scale(1.6);animation-timing-function:ease-in-out}
  67.1875%,100%{transform:none}
}
/* ---- acts: temporal tiers. One act owns the whole canvas; the canvas clears
       by window handoff. A hidden act is parked off-stage so it contributes
       no geometry to any render-side sweep. ---- */
.act{opacity:0;animation-duration:var(--master);animation-timing-function:linear;
     animation-iteration-count:infinite}
.act-1{animation-name:act1;transform:translate(0px,-2400px)}
.act-2{animation-name:act2;transform:translate(0px,-4800px)}
.act-3{animation-name:act3;transform:translate(0px,-7200px)}
.act-4{animation-name:act4;transform:none}
@keyframes act1{
  0%,2.99%{opacity:0;transform:translate(0px,-2400px)}
  3%{opacity:0;transform:none}
  5.2083%,17.1875%{opacity:1;transform:none}
  18.75%{opacity:0;transform:none}
  18.76%,67.1775%{opacity:0;transform:translate(0px,-2400px)}
  67.1875%{opacity:0;transform:none}
  68.75%,76.5625%{opacity:1;transform:none}
  78.125%{opacity:0;transform:none}
  78.135%,100%{opacity:0;transform:translate(0px,-2400px)}
}
@keyframes act2{
  0%,15.615%{opacity:0;transform:translate(0px,-4800px)}
  15.625%{opacity:0;transform:none}
  17.1875%,34.375%{opacity:1;transform:none}
  35.9375%{opacity:0;transform:none}
  35.9475%,74.99%{opacity:0;transform:translate(0px,-4800px)}
  75%{opacity:0;transform:none}
  76.5625%,84.375%{opacity:1;transform:none}
  85.9375%{opacity:0;transform:none}
  85.9475%,100%{opacity:0;transform:translate(0px,-4800px)}
}
@keyframes act3{
  0%,32.8025%{opacity:0;transform:translate(0px,-7200px)}
  32.8125%{opacity:0;transform:none}
  34.375%,51.5625%{opacity:1;transform:none}
  53.125%{opacity:0;transform:none}
  53.135%,82.8025%{opacity:0;transform:translate(0px,-7200px)}
  82.8125%{opacity:0;transform:none}
  84.375%,92.1875%{opacity:1;transform:none}
  93.75%{opacity:0;transform:none}
  93.76%,100%{opacity:0;transform:translate(0px,-7200px)}
}
@keyframes act4{
  0%{opacity:1;transform:none}
  2.8%{opacity:0;transform:none}
  2.81%,49.99%{opacity:0;transform:translate(0px,-9600px)}
  50%{opacity:0;transform:none}
  51.5625%,68.75%{opacity:1;transform:none}
  70.3125%{opacity:0;transform:none}
  70.3225%,90.615%{opacity:0;transform:translate(0px,-9600px)}
  90.625%{opacity:0;transform:none}
  92.1875%,100%{opacity:1;transform:none}
}
/* ---- staged states: overlays on the same master, windows from the sheet ---- */
.stage{opacity:0;animation-duration:var(--master);animation-timing-function:linear;
       animation-iteration-count:infinite}
.stage-a1{animation-name:stg-a1}
.stage-a2{animation-name:stg-a2}
.stage-a3{animation-name:stg-a3}
@keyframes stg-a1{0%,8.854%{opacity:0}10.4167%,17.1875%{opacity:1}
  18.75%,67.1875%{opacity:0}68.75%,76.5625%{opacity:1}78.125%,100%{opacity:0}}
@keyframes stg-a2{0%,25.5208%{opacity:0}27.0833%,34.375%{opacity:1}
  35.9375%,75%{opacity:0}76.5625%,84.375%{opacity:1}85.9375%,100%{opacity:0}}
@keyframes stg-a3{0%,42.7083%{opacity:0}44.2708%,51.5625%{opacity:1}
  53.125%,82.8125%{opacity:0}84.375%,92.1875%{opacity:1}93.75%,100%{opacity:0}}
/* ---- captions: typewriter wipe, narrator-card polarity ---- */
.beat-caption{opacity:0;clip-path:inset(-6% 101% -6% -1%);
  animation-duration:var(--master);animation-timing-function:linear;animation-iteration-count:infinite}
.caption-box{fill:var(--ink);stroke:none;opacity:.97}
.beat-caption text{fill:var(--surface);font-family:var(--font-label);font-weight:600;
                   text-anchor:middle;font-variant-ligatures:none}
.cap-b1{animation-name:cap-b1}.cap-b1 text{font-size:24px}
.cap-b2{animation-name:cap-b2}.cap-b2 text{font-size:15px}
.cap-b3{animation-name:cap-b3}.cap-b3 text{font-size:15px}
.cap-b4{animation-name:cap-b4}.cap-b4 text{font-size:15px}
.cap-b5{animation-name:cap-b5}.cap-b5 text{font-size:15px}
@keyframes cap-b2{0%,9.4%{opacity:0;clip-path:inset(-6% 101% -6% -1%)}
  9.42%{opacity:1;clip-path:inset(-6% 101% -6% -1%)}
  11.3%,16.2%{opacity:1;clip-path:inset(-6% -1% -6% -1%)}
  17.1875%,100%{opacity:0;clip-path:inset(-6% -1% -6% -1%)}}
@keyframes cap-b3{0%,21.5%{opacity:0;clip-path:inset(-6% 101% -6% -1%)}
  21.52%{opacity:1;clip-path:inset(-6% 101% -6% -1%)}
  23.4%,33.4%{opacity:1;clip-path:inset(-6% -1% -6% -1%)}
  34.375%,100%{opacity:0;clip-path:inset(-6% -1% -6% -1%)}}
@keyframes cap-b4{0%,38.7%{opacity:0;clip-path:inset(-6% 101% -6% -1%)}
  38.72%{opacity:1;clip-path:inset(-6% 101% -6% -1%)}
  40.6%,50.6%{opacity:1;clip-path:inset(-6% -1% -6% -1%)}
  51.5625%,100%{opacity:0;clip-path:inset(-6% -1% -6% -1%)}}
@keyframes cap-b5{0%,55.9%{opacity:0;clip-path:inset(-6% 101% -6% -1%)}
  55.92%{opacity:1;clip-path:inset(-6% 101% -6% -1%)}
  57.8%,63%{opacity:1;clip-path:inset(-6% -1% -6% -1%)}
  64.5%,100%{opacity:0;clip-path:inset(-6% -1% -6% -1%)}}
@keyframes cap-b1{0%,69.6%{opacity:0;clip-path:inset(-6% 101% -6% -1%)}
  69.62%{opacity:1;clip-path:inset(-6% 101% -6% -1%)}
  72%,75.6%{opacity:1;clip-path:inset(-6% -1% -6% -1%)}
  76.5625%,100%{opacity:0;clip-path:inset(-6% -1% -6% -1%)}}
/* ---- act spotlight: corner brackets, opacity only (house idiom) ---- */
.node__focus{fill:none;stroke:var(--ink);stroke-width:3px;stroke-linecap:square;opacity:0;
  animation-duration:var(--master);animation-timing-function:linear;animation-iteration-count:infinite}
.focus-a1{animation-name:focus-a1}
.focus-a2{animation-name:focus-a2}
.focus-a3{animation-name:focus-a3}
.focus-a4{animation-name:focus-a4}
@keyframes focus-a1{0%,9.9%{opacity:0}11.3%,16.2%{opacity:1}17.1875%,100%{opacity:0}}
@keyframes focus-a2{0%,22%{opacity:0}23.4%,33.4%{opacity:1}34.375%,100%{opacity:0}}
@keyframes focus-a3{0%,39.2%{opacity:0}40.6%,50.6%{opacity:1}51.5625%,100%{opacity:0}}
@keyframes focus-a4{0%,56.4%{opacity:0}57.8%,63%{opacity:1}64.5%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .camera{animation:none !important;transform:none !important}
  .layer-chrome{animation:none !important;opacity:1 !important}
  /* the informative end state is the FINISHED architecture, act 4 alone */
  .act{animation:none !important;opacity:0 !important}
  .act-1{transform:translate(0px,-2400px) !important}
  .act-2{transform:translate(0px,-4800px) !important}
  .act-3{transform:translate(0px,-7200px) !important}
  .act-4{opacity:1 !important;transform:none !important}
  .stage{animation:none !important;opacity:0 !important}
  .beat-caption{animation:none !important;opacity:0 !important}
  .node__focus{animation:none !important;opacity:0 !important}
  .anim-dash-flow,.state-sync-line,.state-degrade-ring{animation:none !important}
  /* the replica would stay where a state is the resting truth; act 4 is healthy,
     so nothing here is staged — only the intensity motions need silencing */
  .anim-shake-stress{animation:none !important;transform:none !important}
  .edge--async{stroke-dasharray:12 9 !important}
  .packet,.anim-packet{animation:none !important;offset-distance:100% !important;opacity:1 !important}
  .anim-queue-fill{animation:none !important;clip-path:inset(0 var(--empty,3%) 0 0) !important}
}
</style></head><body>
<svg viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Scaling one system from 0 to 500K concurrent users across four architectures</title>
  <desc id="d">One system, four architectures: what broke decided every boundary. Act 1, ONE BOX,
  to 1K concurrent users: a monolith on four vCPU and a single Postgres; the hundred-connection
  pool fills, and Postgres turns amber and trembles behind a 100 of 100 connections chip. Act 2,
  CLONE THE APP, to 10K: an application load balancer, six app replicas and a Redis cache with a
  90 percent hit rate fix the pool, but the single Postgres now caps at about two thousand writes
  per second and goes amber again. Act 3, SPLIT READS FROM WRITES, to 100K: a CDN takes static and
  API reads, a queue takes async work which workers drain for emails and exports, and three read
  replicas take reads, yet one hot row turns Postgres red and dashed and the replicas lag 1.8
  seconds. Act 4, SHARD AND FAN OUT, to 500K: Postgres becomes sixteen shards keyed by user id, a
  pub/sub stream that every cell subscribes to fans invalidations and events out, and three cells
  cap the blast radius; every component is healthy. The four acts then replay in order and the loop
  parks on act 4.</desc>
  <defs>
    <pattern id="grid-pat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--grid)" stroke-width="1"/>
    </pattern>
    <marker id="v-arrow" class="marker" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="v-arrow-open" class="marker marker--open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10" fill="none"/></marker>
  </defs>

  <g class="camera">
    <rect class="world-grid" x="-400" y="-400" width="2720" height="1880"/>

    <!-- ============ persistent scenery: title band + shared legend ============ -->
    <g class="layer-chrome">
      <g aria-hidden="true">
        <text class="title" x="960" y="54">0 → 500K CCU</text>
        <text class="subtitle" x="960" y="86">monolith · +cache and replicas · +CDN and queue · 16 shards in 3 cells</text>
      </g>
      <g class="legend" transform="translate(0,0)">
        <rect x="150" y="944" width="18" height="18" rx="4" fill="var(--role-client)" stroke="var(--ink-client)" stroke-width="1.8"/>
        <text x="176" y="958">client <tspan class="k">users</tspan></text>
        <rect x="307" y="944" width="18" height="18" rx="4" fill="var(--role-service)" stroke="var(--ink-service)" stroke-width="1.8"/>
        <text x="333" y="958">service <tspan class="k">monolith · alb · app</tspan></text>
        <rect x="600" y="944" width="18" height="18" rx="4" fill="var(--role-data)" stroke="var(--ink-data)" stroke-width="1.8"/>
        <text x="626" y="958">data <tspan class="k">postgres · redis</tspan></text>
        <rect x="840" y="944" width="18" height="18" rx="4" fill="var(--role-async)" stroke="var(--ink-async)" stroke-width="1.8"/>
        <text x="866" y="958">async <tspan class="k">queue · stream</tspan></text>
        <rect x="1060" y="944" width="18" height="18" rx="4" fill="var(--role-infra)" stroke="var(--ink-infra)" stroke-width="1.8"/>
        <text x="1086" y="958">infra <tspan class="k">cdn · cells</tspan></text>
        <rect x="1260" y="944" width="18" height="18" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="3.2"/>
        <text x="1286" y="958">thicker outline = <tspan class="k">new in this act</tspan></text>

        <line x1="150" y1="1000" x2="196" y2="1000" stroke="var(--stroke)" stroke-width="2" opacity=".55"/>
        <text x="204" y="1004">request path</text>
        <line x1="322" y1="1000" x2="368" y2="1000" stroke="var(--ink-async)" stroke-width="2" stroke-dasharray="12 9" opacity=".8"/>
        <text x="376" y="1004">async path</text>
        <g transform="translate(497,1000)" color="var(--stroke)"><circle r="5" fill="currentColor"/></g>
        <text x="512" y="1004">request</text>
